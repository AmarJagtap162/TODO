<h1>Todo</h1>
<div class="container">
    <form>
        <div class="form-group">
            <label>Description</label>
            <input type="text" class="form-control" [(ngModel)]="todo.description" name="description"/>
        </div>
        <div class="form-group">
            <label>Target Date</label>
            <input type="date" class="form-control" [(ngModel)]="todo.targetDate" name="targetDate"/>
        </div>
        <button class="btn btn-success" (click)="saveTodo()">Save</button>
    </form>
</div>
