<h1>My Todo's</h1>

<div class="alert alert-success" *ngIf="message">{{message}}</div>

<div class="container">
    <table class="table">
        <caption>My Todo's</caption>
        <thead>
            <tr>
                <th>id</th>
                <th>description</th>
                <th>Target Date</th>
                <th>Is Completed</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- for(Todo todo : todos) -->
            <tr *ngFor="let todo of todos">
                <td>{{todo.id}}</td>
                <td>{{todo.description}}</td>
                <td>{{todo.targetDate | date | uppercase}}</td>
                <td>{{todo.isDone}}</td>
                <td><button class="btn btn-danger" (click) = "deleteTodo(todo.id)" >Delete</button></td>
                <td><button class="btn btn-success" (click) = "updateTodo(todo.id)" >Update</button></td>
            </tr>
        </tbody>

    </table>
</div>
